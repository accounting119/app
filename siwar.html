<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>دعوة لمقابلة عمل — سوار · Siwar</title>
<meta property="og:title" content="دعوة لمقابلة عمل — سوار">
<meta property="og:description" content="افتح الرابط لتأكيد حضورك أو طلب موعد آخر · Job interview invitation — Siwar">
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Tahoma,Arial,sans-serif;background:#F8FAFC;color:#1E293B;padding:20px}
  .c{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:26px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(30,41,59,.08)}
  .t{font-size:19px;font-weight:bold;color:#1E293B}.s{font-size:12.5px;color:#64748B;margin-top:4px}
  .sp{width:26px;height:26px;border:3px solid #E2E8F0;border-top-color:#D4AF37;border-radius:50%;animation:r .8s linear infinite;margin:18px auto 8px}@keyframes r{to{transform:rotate(360deg)}}
  .m{font-size:13.5px}.e{color:#B91C1C;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="c">
  <div class="t">سوار · Siwar</div>
  <div class="s">دعوة لمقابلة عمل · Job interview invitation</div>
  <div class="sp" id="sp"></div>
  <div class="m" id="msg">جارٍ فتح دعوتك… · Opening your invitation…</div>
</div>
<script>
  /* رابط النظام (ينتهي بـ /exec) — يبقى ثابتًا ما دام التحديث بـ «Manage deployments ← Edit ← New version» لا بنشر جديد */
  var SYSTEM = 'https://script.google.com/macros/s/AKfycbwmvlc6q-jish2nNxSeYJ2HsdW7LxEgvkcwiqmCxObKUC7VZJ39Adt8ph-CmlwbWsST2g/exec';
  /* صفحة تحويل فقط: رمز الدعوة بعد # (لا يصل أي خادم) ← صفحة دعوة المرشح في النظام. لا بيانات هنا */
  var k = (location.hash || '').replace(/^#/, '');
  var sysOk = /^https:\/\/script\.google\.com\/(a\/macros\/[\w.\-]+|macros)\/s\/[\w\-]+\/exec$/.test(SYSTEM);
  if (sysOk && /^[A-Za-z0-9]{10,64}$/.test(k)) location.replace(SYSTEM + '?iv=' + k);
  else {
    document.getElementById('sp').style.display = 'none';
    document.getElementById('msg').innerHTML = '<div class="e">' + (sysOk ? 'الرابط غير مكتمل — افتحه من رسالة الدعوة كما وصلتك<br>Incomplete link — open it from your invitation message' : 'الصفحة لم تُضبط بعد — تواصل مع الموارد البشرية<br>This page is not set up yet — please contact HR') + '</div>';
  }
</script>
</body>
</html>
